
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medibot-deployment
  labels:
    app: medibot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: medibot
  template:
    metadata:
      labels:
        app: medibot
    spec:
      containers:
        - name: medibot
          image: medibot-medibot:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: medibot-config
          env:
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: medibot-secret
                  key: GROQ_API_KEY
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
